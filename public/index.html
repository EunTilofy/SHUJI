<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0f1b">
    <title>数迹 · 多目标数字推理</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="数迹首页">
        <span class="brand-mark"><i></i><i></i><i></i><i></i></span>
        <span>数迹</span>
      </a>
      <div class="top-actions">
        <button class="text-button theme-button" id="themeButton" aria-label="切换浅色模式">☀ 浅色</button>
        <button class="text-button" id="helpButton">玩法</button>
      </div>
    </header>

    <main>
      <section class="hero panel" id="homeView">
        <div class="eyebrow"><span></span> DIGIT TRAILS</div>
        <p class="hero-copy">每次猜测都会同时照亮多条线索。独自破局，或邀请朋友进入同一房间实时竞速。</p>
        <div class="mode-tabs">
          <button class="mode-tab active" data-mode="solo">独自挑战</button>
          <button class="mode-tab" data-mode="create">创建房间</button>
          <button class="mode-tab" data-mode="join">加入房间</button>
        </div>
        <form id="startForm" class="setup-form">
          <label class="field" id="identityField">
            <span>玩家 ID <small>同一 IP 首次设置后固定</small></span>
            <input id="nameInput" maxlength="16" value="玩家" autocomplete="nickname">
          </label>
          <div class="fixed-identity hidden" id="fixedIdentity">
            <span>固定玩家 ID</span>
            <strong id="fixedIdentityName"></strong>
          </div>
          <label class="field join-only hidden">
            <span>房间代码</span>
            <input id="codeInput" maxlength="6" placeholder="例如 8K2JXM" autocomplete="off">
          </label>
          <div class="config-fields config-only">
            <label class="field">
              <span>目标数量 <b id="targetValue">4</b></span>
              <input id="targetInput" type="range" min="1" max="6" value="4">
            </label>
            <label class="field">
              <span>数字长度 <b id="lengthValue">8</b></span>
              <input id="lengthInput" type="range" min="3" max="10" value="8">
            </label>
          </div>
          <div class="round-preview config-only">
            <span>本局轮次</span>
            <strong id="roundPreview">10</strong>
            <small>根据信息量与目标数自动平衡</small>
          </div>
          <button class="primary-button" id="startButton" type="submit"><span>开始追迹</span><b>→</b></button>
        </form>
      </section>

      <section class="game-shell hidden" id="gameView">
        <div class="game-heading">
          <div class="game-title">
            <button class="back-button" id="backButton">← 返回</button>
            <div class="eyebrow"><span></span> <b id="roomLabel">单人挑战</b></div>
            <h2>追踪全部数字</h2>
          </div>
          <div class="game-meta">
            <div><small>轮次</small><strong><span id="roundNow">0</span>/<span id="roundLimit">10</span></strong></div>
            <div><small>已找到</small><strong><span id="solvedNow">0</span>/<span id="targetCount">4</span></strong></div>
          </div>
        </div>

        <div class="lobby panel hidden" id="lobbyView">
          <div class="room-code-wrap">
            <small>点击复制房间代码</small>
            <button id="copyCode" class="room-code">------</button>
            <p>朋友加入后，由房主统一开始。最多支持 30 人。</p>
          </div>
          <div class="lobby-players">
            <h3>已就位 <span id="lobbyCount">1</span></h3>
            <div id="lobbyPlayerList"></div>
          </div>
          <button class="primary-button hidden" id="beginButton"><span>所有人准备好了</span><b>→</b></button>
          <p class="waiting hidden" id="waitingText">等待房主开始<span class="dots">...</span></p>
        </div>

        <div id="playView" class="hidden">
          <div class="status-strip" id="statusStrip"></div>
          <div class="boards-viewport"><div class="boards" id="boards"></div></div>
          <form class="guess-bar" id="guessForm">
            <div class="guess-input-wrap">
              <small>输入 <span id="guessLength">8</span> 位数字</small>
              <input id="guessInput" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            </div>
            <button class="guess-button" type="submit">提交猜测 <span>↵</span></button>
          </form>
        </div>

        <div class="results panel hidden" id="resultsView">
          <div class="result-kicker">TRAIL COMPLETE</div>
          <h2 id="resultTitle">本局结束</h2>
          <p id="resultCopy"></p>
          <div class="result-tabs" id="resultTabs"></div>
          <div class="boards-viewport result-boards"><div class="boards" id="resultBoards"></div></div>
          <div class="answers" id="answers"></div>
          <button class="primary-button" id="homeButton"><span>再来一局</span><b>↻</b></button>
        </div>
      </section>
    </main>

    <div class="toast" id="toast"></div>
    <dialog id="infoDialog">
      <button class="dialog-close" data-close>×</button>
      <div id="dialogContent"></div>
    </dialog>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
